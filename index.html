<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>트래블 버디</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — left nav + working area; schedule = list | map split view. Trip card uses a boarding-pass motif. */
:root{
  --bg:#edf2f0; --surface:#ffffff; --surface-2:#f4f7f6; --ink:#13201e; --muted:#5a6d69; --line:#d8e1de;
  --accent:#0b6a5e; --accent-ink:#ffffff; --accent-soft:#dbeee9; --stamp:#c4473c; --sun:#d8921f; --sun-soft:#fbeed6;
  --ok:#2d8a52; --ok-soft:#dcf0e3; --warn:#a96f08; --danger:#c4473c; --danger-soft:#f8e1de;
  --c-food:#de6a4c; --c-shop:#a35bc0; --c-dessert:#d4708f; --c-sight:#2f7bc9; --c-stay:#5a60c4; --c-move:#5f7872; --c-rest:#3a9a70; --c-etc:#8b8c78;
  --map-bg:#e4eee9; --map-grid:#d2dfd9; --map-label:#13201e;
  --shadow:0 1px 2px rgb(19 32 30 / .06),0 10px 28px rgb(19 32 30 / .08);
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1615; --surface:#15201e; --surface-2:#1b2826; --ink:#e4eeeb; --muted:#93a7a2; --line:#2a3a37;
  --accent:#43b8a5; --accent-ink:#04201b; --accent-soft:#183531; --stamp:#e46c61; --sun:#efb24e; --sun-soft:#3a2f1a;
  --ok:#5cc485; --ok-soft:#183324; --warn:#e6b04c; --danger:#ec7b70; --danger-soft:#3a1d1a;
  --c-food:#ee8064; --c-shop:#c182dc; --c-dessert:#e78fab; --c-sight:#5aa0e6; --c-stay:#868ce6; --c-move:#88a39c; --c-rest:#5cbf93; --c-etc:#aaab95;
  --map-bg:#13221f; --map-grid:#1e302c; --map-label:#e4eeeb;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 28px rgb(0 0 0 / .35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1615; --surface:#15201e; --surface-2:#1b2826; --ink:#e4eeeb; --muted:#93a7a2; --line:#2a3a37;
  --accent:#43b8a5; --accent-ink:#04201b; --accent-soft:#183531; --stamp:#e46c61; --sun:#efb24e; --sun-soft:#3a2f1a;
  --ok:#5cc485; --ok-soft:#183324; --warn:#e6b04c; --danger:#ec7b70; --danger-soft:#3a1d1a;
  --c-food:#ee8064; --c-shop:#c182dc; --c-dessert:#e78fab; --c-sight:#5aa0e6; --c-stay:#868ce6; --c-move:#88a39c; --c-rest:#5cbf93; --c-etc:#aaab95;
  --map-bg:#13221f; --map-grid:#1e302c; --map-label:#e4eeeb;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 28px rgb(0 0 0 / .35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);letter-spacing:.02em}
.muted{color:var(--muted)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.block{width:100%;padding:12px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.field{display:grid;gap:6px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none;min-width:0}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.sun{background:var(--sun-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.line{border:1px solid var(--line);color:var(--muted)}
.avatar{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;border:2px solid var(--surface);flex:none}
.avatars{display:flex}.avatars .avatar+.avatar{margin-left:-8px}

/* ---------- auth ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr;padding-inline:16px}
.auth-art{padding:48px clamp(16px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px;letter-spacing:.01em}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.auth-art h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.2vw,48px);line-height:1.18;max-width:14em}
.auth-art h1 em{font-style:normal;color:var(--accent)}
.auth-art .lede{color:var(--muted);max-width:32em;font-size:16px}
.feature-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:520px}
.feature{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.feature .fi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.feature b{display:block}
.auth-side{display:grid;place-items:center;padding-block:40px}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);display:grid;gap:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:11px;padding:4px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .1)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.form-error{color:var(--danger);font-size:13px;min-height:1em}
.fine{font-size:12px;color:var(--muted);text-align:center}

/* boarding pass */
.pass{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 150px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;max-width:560px}
.pass-main{padding:20px 22px;display:grid;gap:14px;min-width:0}
.pass-stub{border-left:2px dashed var(--line);padding:20px 16px;display:grid;align-content:space-between;gap:10px;background:var(--surface-2)}
.pass::before,.pass::after{content:"";position:absolute;right:141px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass::before{top:-11px}.pass::after{bottom:-11px}
.route{display:flex;align-items:center;gap:14px}
.route .code{font-family:var(--f-mono);font-weight:600;font-size:30px;line-height:1}
.route .city{font-size:12px;color:var(--muted)}
.route .line{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px);position:relative;min-width:30px}
.route .line svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);padding:0 4px;color:var(--accent);width:26px;height:26px}
.pass-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pass-meta div{min-width:0}
.pass-meta .label{font-size:10.5px}
.pass-meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dday{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent)}
.dday.small{font-size:30px}
.barcode{height:34px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px);opacity:.75;border-radius:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface)}
.trip-switch{display:grid;gap:4px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-align:left;width:100%}
.trip-switch:hover{border-color:var(--accent)}
.trip-switch b{font-size:15px}
.trip-menu{display:grid;gap:4px}
.trip-menu button{display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;border-radius:8px;padding:8px 10px;text-align:left;font-size:14px}
.trip-menu button:hover{background:var(--surface-2)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-weight:500;color:var(--muted);text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--stamp);color:#fff;border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.side-foot .who{min-width:0;flex:1;font-size:13px}
.side-foot .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who span{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .t{min-width:0;flex:1}
.topbar h1{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:13px;color:var(--muted)}
.topbar .acts{display:flex;align-items:center;gap:8px}
.mobile-brand{display:none}
.view{padding:24px 28px 40px;display:grid;gap:20px;align-content:start}
.tabbar{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:16px;font-weight:700}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-home{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;min-width:0}
.stat:hover{border-color:var(--accent)}
.stat b{font-size:22px;font-weight:700}
.stat .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick button{display:grid;justify-items:center;gap:8px;padding:14px 8px;border:1px dashed var(--line);border-radius:12px;background:transparent;font-size:13px;font-weight:600}
.quick button:hover{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.quick .qi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}
.phase{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.phase span{padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
.phase span.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* list rows */
.rows{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .grow b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .grow span{font-size:12.5px;color:var(--muted)}
.cat-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0;color:transparent}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done b{text-decoration:line-through;color:var(--muted)}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:30px 16px;color:var(--muted)}
.empty .ei{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.empty b{color:var(--ink);font-size:15px}

/* swipe */
.swipe{position:relative;overflow:hidden}
.swipe-del{position:absolute;inset:0 0 0 auto;width:84px;display:grid;place-items:center;background:var(--danger);color:#fff;border:0;font-weight:700;font-size:13px}
.swipe-inner{position:relative;background:var(--surface);transition:transform .2s;touch-action:pan-y}
.swipe.dragging .swipe-inner{transition:none}

/* ---------- schedule ---------- */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.day-chip{flex:none;display:grid;gap:1px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px}
.day-chip b{font-size:14px}.day-chip span{font-size:12px;color:var(--muted)}
.day-chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day-chip.on span{color:var(--bg);opacity:.75}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .l,.toolbar .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-size:13.5px;font-weight:600}
.toggle .sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgb(0 0 0 / .25)}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw::after{transform:translateX(14px)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.map-wrap{position:sticky;top:90px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.map-wrap svg{display:block;width:100%;height:auto}
.map-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.map-foot a{color:var(--accent);font-weight:600;text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.pin{cursor:pointer}
.pin:hover circle{stroke-width:4}
.timeline{display:grid}
.tl{display:grid;grid-template-columns:54px 34px minmax(0,1fr);gap:12px;align-items:start}
.tl-time{font-family:var(--f-mono);font-weight:600;font-size:14px;padding-top:7px;text-align:right}
.tl-time small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted)}
.tl-rail{display:grid;justify-items:center;height:100%}
.tl-rail .cat-ic{border-radius:50%}
.tl-rail i{width:2px;flex:1;background:var(--line);min-height:12px}
.tl-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;margin-bottom:8px;transition:border-color .2s,box-shadow .2s}
.tl-card.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tl-card .swipe-inner{padding:11px 12px;display:grid;gap:4px}
.tl-head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.tl-head b{font-weight:700;font-size:15px;min-width:0}
.tl-place{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tl-note{font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 9px;margin-top:4px}
.tl-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tl-acts{display:flex;gap:2px;flex:none}
.tl-acts .icon-btn{width:28px;height:28px}
.move{display:grid;grid-template-columns:54px 34px minmax(0,1fr);gap:12px;margin:-2px 0 8px}
.move .tl-rail i{border-left:2px dashed var(--line);background:none}
.move-box{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--muted);padding:4px 0}
.move-box .m{display:inline-flex;gap:4px;align-items:center}
.move-box .m.rec{color:var(--accent);font-weight:700}
.rest-card{border:1.5px dashed var(--c-rest);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px;background:color-mix(in srgb,var(--c-rest) 8%,var(--surface))}
.rest-card p{font-size:13px}
.rest-card b{color:var(--c-rest)}

/* ---------- budget ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.kpi b{display:block;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .label{font-size:11px}
.donut-wrap{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:center}
.legend{display:grid;gap:10px}
.leg{display:grid;gap:4px}
.leg-top{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.leg-top span{display:inline-flex;align-items:center;gap:7px}
.leg-top i{width:10px;height:10px;border-radius:3px;display:inline-block}
.track{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.track i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.track.over i{background:var(--danger)!important}
.fx{display:grid;gap:12px}
.fx-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}

.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}

.add-inline{display:flex;gap:8px;flex-wrap:wrap}

.assignee{border:0;background:transparent;padding:0}

.offline.off{background:var(--sun-soft);color:var(--warn)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;display:grid;justify-items:center;gap:8px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.voucher{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;text-align:left;padding:0}

.v-top img{width:100%;height:100%;object-fit:cover}
.v-top .vt{position:absolute;top:8px;left:8px}
.v-body{padding:10px 12px;display:grid;gap:2px;font-size:13px}
.v-body b{font-size:14px}
.ticket{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ticket-h{background:var(--accent);color:var(--accent-ink);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.ticket-b{padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ticket-b div{min-width:0}
.ticket-b b{display:block;font-family:var(--f-mono);font-size:15px;overflow-wrap:anywhere}

.chat-b{flex:1;overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}

.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg.me .bub{background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px}

.sys{justify-self:center;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:99px;padding:4px 12px;text-align:center}
.chat-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.typing{font-size:12px;color:var(--muted);padding:0 16px 8px}
.fab-dot{position:relative}
.fab-dot[data-n]::after{content:attr(data-n);position:absolute;top:-2px;right:-2px;background:var(--stamp);color:#fff;font-size:10px;font-weight:700;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}

/* ---------- geo ---------- */
function hav(a, b){ const R=6371, r=x=>x*Math.PI/180; const dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function travel(a, b, trip){
  const km = hav(a,b) * 1.25, slow = trip.relaxed ? 1.4 : 1;
  const walk = Math.max(1, Math.round(km/4.2*60*slow));
  const transit = Math.round((6 + km/24*60) * slow);
  const car = Math.round((4 + km/30*60) * slow);
  const mode = DEST[trip.dest].mode;
  const rec = km < 1.2 ? 'walk' : (mode === 'car' ? 'car' : 'transit');
  return {km, walk, transit, car, rec, min: {walk, transit, car}[rec]};
}

/* ---------- auth ---------- */
function users(){ return store.get('tb.users') || {}; }
function startSession(email){ session = email; store.set('tb.session', email); db = store.get('tb.u.'+email); state.tab='home'; state.day=0; render(); }
function doLogin(f){
  const email = f.email.value.trim().toLowerCase(), pw = f.pw.value; const U = users();
  if (state.authMode === 'signup'){
    const name = f.elements.name.value.trim();
    if (!name) return formErr(f, '이름을 입력해 주세요.');
    if (!/^\S+@\S+\.\S+$/.test(email)) return formErr(f, '이메일 형식을 확인해 주세요.');
    if (pw.length < 6) return formErr(f, '비밀번호는 6자 이상이어야 해요.');
    if (U[email]) return formErr(f, '이미 가입된 이메일이에요. 로그인해 주세요.');
    U[email] = {name, pw:hash(pw)}; store.set('tb.users', U);
    store.set('tb.u.'+email, {name, email, trips:[], active:null});
    startSession(email); toast(`${name}님, 환영해요! 첫 여행을 만들어 볼까요?`);
  } else {
    if (!U[email] || U[email].pw !== hash(pw)) return formErr(f, '이메일 또는 비밀번호가 맞지 않아요.');
    startSession(email); toast(`${U[email].name}님, 다시 오셨네요`);
  }
}
function demoLogin(){
  const email = 'demo@travelbuddy.app'; const U = users();
  if (!U[email]) { U[email] = {name:'김여행', pw:hash('demo1234')}; store.set('tb.users', U); }
  if (!store.get('tb.u.'+email)) { const t = seedDemo('김여행'); store.set('tb.u.'+email, {name:'김여행', email, trips:[t], active:t.id}); }
  startSession(email); toast('데모 계정으로 로그인했어요');
}
const formErr = (f, m) => { const e = $('.form-error', f); if (e) e.textContent = m; };

/* ---------- home ---------- */
function spent(t){ return t.expenses.reduce((s,e) => s + toKRW(e.amount, e.cur), 0); }
function viewHome(t){
  const D = DEST[t.dest], dd = ddayInfo(t);
  const packDone = t.packing.filter(p=>p.done).length, packPct = Math.round(packDone / Math.max(1,t.packing.length) * 100);
  const sp = spent(t), spPct = Math.min(100, Math.round(sp / Math.max(1,t.budget) * 100));
  const todo = t.tasks.filter(x=>!x.done).map(x => ({...x, ...taskDue(t,x)})).sort((a,b)=>a.left-b.left).slice(0,4);
  const dayIdx = dd.phase===1 ? Math.min(tripDays(t)-1, -diffDays(toDate(t.start), today())) : 0;
  const upcoming = t.schedule.filter(s=>s.day===dayIdx).sort((a,b)=>toMin(a.time)-toMin(b.time)).slice(0,4);
  return `

          <div><span class="label">모드</span><b>${t.relaxed?'여유 일정':'일반 일정'}</b></div>

function taskRow(x){
  const st = x.done ? '' : x.left < 0 ? `<span class="pill danger">${-x.left}일 지남</span>` : x.left <= 3 ? `<span class="pill sun">${x.left===0?'오늘':x.left+'일 남음'}</span>` : `<span class="pill line">${x.left}일 남음</span>`;
  return `<div class="task ${x.done?'done':''}"><button class="check ${x.done?'on':''}" data-act="task" data-v="${x.id}" aria-label="완료 표시">${ic('check','sm')}</button>
    <div class="grow" style="min-width:0"><b style="font-weight:600">${esc(x.title)}</b><div class="when">D-${x.before} · ${md(x.due)}까지</div></div>${st}</div>`;
}
const emptySched = () => `<div class="empty"><span class="ei">${ic('cal')}</span><b>아직 일정이 없어요</b><span>인기 장소로 추천 일정을 채우거나 직접 추가해 보세요.</span><div class="chips" style="justify-content:center"><button class="btn primary sm" data-act="suggest">${ic('sparkle','sm')} 추천 일정 불러오기</button><button class="btn sm" data-act="add-sched">${ic('plus','sm')} 직접 추가</button></div></div>`;

/* ---------- schedule ---------- */
function dayItems(t, d){ return t.schedule.filter(s=>s.day===d).sort((a,b)=>toMin(a.time)-toMin(b.time)); }
function nearestRest(t, p){
  const cands = DEST[t.dest].places.filter(x => x.cat==='rest'||x.cat==='dessert');
  return cands.map(x => ({...x, d:hav(p,x)})).sort((a,b)=>a.d-b.d)[0];
}
function viewSchedule(t){
  const n = tripDays(t); if (state.day >= n) state.day = 0;
  const items = dayItems(t, state.day);
  let html = '', acc = 0;
  items.forEach((s, i) => {
    const next = items[i+1];
    html += `<div class="tl"><div class="tl-time">${s.time}<small>${fmtDur(s.dur)}</small></div><div class="tl-rail">${catIc(s.cat)}<i></i></div>
      <article class="tl-card swipe ${state.hl===s.id?'hl':''}" id="s-${s.id}" data-id="${s.id}" data-kind="sched">
        <button class="swipe-del" data-act="del-sched" data-v="${s.id}">삭제</button>
        <div class="swipe-inner">
          <div class="tl-head"><b>${esc(s.title)}</b><div class="tl-acts"><button class="icon-btn" data-act="edit-sched" data-v="${s.id}" aria-label="수정">${ic('edit','sm')}</button><button class="icon-btn" data-act="del-sched" data-v="${s.id}" aria-label="삭제">${ic('trash','sm')}</button></div></div>
          <div class="tl-place">${esc(s.place)}${s.addr?' · '+esc(s.addr):''}</div>
          <div class="tl-tags"><span class="pill" style="background:color-mix(in srgb,${cc(s.cat)} 15%,transparent);color:${cc(s.cat)}">${CATS[s.cat].label}</span><span class="pill line">${s.time} – ${toTime(toMin(s.time)+s.dur)}</span>${t.vouchers.some(v=>v.schedId===s.id)?`<button class="pill accent" style="border:0" data-act="view-voucher" data-v="${t.vouchers.find(v=>v.schedId===s.id).id}">${ic('file','sm')} 바우처</button>`:''}</div>
          ${s.note?`<div class="tl-note">${esc(s.note)}</div>`:''}
        </div>
      </article></div>`;
    acc = (s.cat==='rest'||s.cat==='stay') ? 0 : acc + s.dur;
    const end = toMin(s.time) + s.dur;
    if (t.relaxed && acc >= 150 && next && next.cat !== 'rest') {
      const r = nearestRest(t, s);
      html += `<div class="move"><div></div><div class="tl-rail"><i></i></div><div class="rest-card"><p><b>휴식 30분 추천</b> · 쉬지 않고 ${fmtDur(acc)} 움직였어요.<br><span class="muted">근처 ${esc(r.name)} (${r.d<1?Math.round(r.d*1000)+'m':r.d.toFixed(1)+'km'})</span></p><button class="btn sm" data-act="add-rest" data-after="${s.id}">${ic('plus','sm')} 휴식 넣기</button></div></div>`;
      acc = 0;
    }
    if (next) {
      const tr = travel(s, next, t), gap = toMin(next.time) - end, tight = gap < tr.min;
      html += `<div class="move"><div></div><div class="tl-rail"><i></i></div><div class="move-box">
        <span class="m ${tr.rec==='walk'?'rec':''}">${ic('walk','sm')}${fmtDur(tr.walk)}</span>
        <span class="m ${tr.rec==='transit'?'rec':''}">${ic('bus','sm')}${fmtDur(tr.transit)}</span>
        <span class="m ${tr.rec==='car'?'rec':''}">${ic('car','sm')}${fmtDur(tr.car)}</span>
        <span class="num">${tr.km.toFixed(1)}km</span>
        ${tight ? `<span class="pill danger">이동 시간 ${tr.min-gap}분 부족</span>` : gap > 0 ? `<span class="pill line">여유 ${fmtDur(gap - tr.min)}</span>` : ''}
      </div></div>`;
    }
  });
  const totalKm = items.slice(1).reduce((s,x,i)=>s + travel(items[i], x, t).km, 0);
  return `
  <div class="days">${Array.from({length:n}, (_,i) => { const c = t.schedule.filter(s=>s.day===i).length; return `<button class="day-chip ${state.day===i?'on':''}" data-act="day" data-v="${i}"><b>DAY ${i+1}</b><span>${md(dayDate(t,i))} · ${c}개</span></button>`; }).join('')}</div>
  <div class="toolbar">
    <div class="l"><button class="toggle ${t.relaxed?'on':''}" data-act="relax" title="이동 시간을 넉넉히 잡고 휴식 시간을 추천해요"><span class="sw"></span>여유로운 일정</button>
      <button class="btn sm" data-act="optimize" ${items.length<3?'disabled style="opacity:.5"':''}>${ic('wand','sm')} 동선 최적화</button></div>
    <div class="r"><button class="btn primary sm" data-act="add-sched">${ic('plus','sm')} 일정 추가</button></div>
  </div>
  <div class="split">
    <section class="timeline">${items.length ? html : `<div class="card">${emptySched()}</div>`}</section>
    <section class="map-wrap">${mapSVG(items, t)}
      <div class="map-foot"><span class="muted">DAY ${state.day+1} 총 이동 <b class="num" style="color:var(--ink)">${totalKm.toFixed(1)}km</b></span>
      ${items.length ? `<a href="${gmapsDir(items)}" target="_blank" rel="noopener">Google 지도에서 경로 열기 ${ic('ext','sm')}</a>` : ''}</div>
    </section>
  </div>`;
}
function gmapsDir(items){
  const ll = s => `${s.lat},${s.lng}`;
  if (items.length === 1) return `https://www.google.com/maps/search/?api=1&query=${ll(items[0])}`;
  const mid = items.slice(1,-1).slice(0,8).map(ll).join('|');
  return `https://www.google.com/maps/dir/?api=1&origin=${ll(items[0])}&destination=${ll(items.at(-1))}${mid?'&waypoints='+encodeURIComponent(mid):''}&travelmode=transit`;
}
function mapSVG(items, t){
  const W = 600, H = 440, pad = 56;
  const pts = items.length ? items : [];
  let grid = ''; for (let x=0; x<=W; x+=40) grid += `<line x1="${x}" y1="0" x2="${x}" y2="${H}"/>`; for (let y=0; y<=H; y+=40) grid += `<line x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
  const bg = `<rect width="${W}" height="${H}" fill="var(--map-bg)"/><g stroke="var(--map-grid)" stroke-width="1">${grid}</g>`;
  if (!pts.length) return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="빈 지도">${bg}<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--muted)" font-size="15">일정을 추가하면 지도에 동선이 표시돼요</text></svg>`;
  const lat0 = pts.reduce((s,p)=>s+p.lat,0)/pts.length, kx = Math.cos(lat0*Math.PI/180);
  const xs = pts.map(p=>p.lng*kx), ys = pts.map(p=>p.lat);
  let minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const span = Math.max(maxX-minX, maxY-minY, 0.012);
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const sc = Math.min((W-2*pad), (H-2*pad)) / span;
  const P = p => [W/2 + (p.lng*kx - cx)*sc, H/2 - (p.lat - cy)*sc];
  const xy = pts.map(P);
  // scale bar: 1 degree latitude ≈ 111.32 km
  const kmPerPx = 111.32 / sc; const nice = [0.1,0.2,0.5,1,2,5,10,20,50].find(v => v/kmPerPx >= 60) || 50; const barPx = nice / kmPerPx;
  const route = `<polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
  const pins = pts.map((p,i) => { const [x,y] = xy[i]; const label = p.title.length>13 ? p.title.slice(0,12)+'…' : p.title;
    return `<g class="pin" data-act="pin" data-v="${p.id}" role="button" aria-label="${esc(p.title)}"><circle cx="${x}" cy="${y}" r="15" fill="${cc(p.cat)}" stroke="var(--surface)" stroke-width="3"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="var(--f-mono)">${i+1}</text>
      <text x="${x}" y="${y+33}" text-anchor="middle" fill="var(--map-label)" font-size="12.5" font-weight="600" stroke="var(--map-bg)" stroke-width="4" paint-order="stroke">${esc(label)}</text></g>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="DAY ${state.day+1} 동선 지도">${bg}${route}${pins}
    <g transform="translate(${W-24},30)"><circle r="14" fill="var(--surface)" stroke="var(--line)"/><path d="M0 -9 L4 2 L0 0 L-4 2 Z" fill="var(--stamp)"/><text y="26" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">N</text></g>
    <g transform="translate(18,${H-22})"><rect x="-6" y="-18" width="${barPx+52}" height="30" rx="6" fill="var(--surface)" opacity=".9"/><line x1="0" y1="0" x2="${barPx}" y2="0" stroke="var(--ink)" stroke-width="3"/><line x1="0" y1="-5" x2="0" y2="5" stroke="var(--ink)" stroke-width="2"/><line x1="${barPx}" y1="-5" x2="${barPx}" y2="5" stroke="var(--ink)" stroke-width="2"/><text x="${barPx+8}" y="4" font-size="11.5" font-weight="600" fill="var(--ink)" font-family="var(--f-mono)">${nice<1?nice*1000+'m':nice+'km'}</text></g>
  </svg>`;
}

/* ---------- budget ---------- */

  const exps = [...t.expenses].sort((a,b)=> b.date.localeCompare(a.date));

    <div class="kpi"><span class="label">사용</span><b class="num">${won(sp)}</b><span class="muted" style="font-size:12.5px">${Math.round(sp/Math.max(1,t.budget)*100)}% 사용</span></div>
    <div class="kpi"><span class="label">남은 예산</span><b class="num" style="color:${left<0?'var(--danger)':'var(--ok)'}">${won(left)}</b><span class="muted" style="font-size:12.5px">${left<0?'예산 초과':'여유 있어요'}</span></div>
    <div class="kpi"><span class="label">하루 권장 지출</span><b class="num">${won(Math.max(0,left)/daysLeft)}</b><span class="muted" style="font-size:12.5px">남은 ${daysLeft}일 기준</span></div>
  </div>
  <div class="grid-2">
    <section class="card">
      <div class="card-h"><h2>카테고리별 지출</h2>${top && top.v ? `<span class="pill accent">최다 지출 · ${EXCATS[top.k].label}</span>`:''}</div>
      <div class="donut-wrap">
        <svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="카테고리별 지출 도넛 차트"><circle r="${R}" cx="90" cy="90" fill="none" stroke="var(--surface-2)" stroke-width="24"/>${arcs}
          <text x="90" y="84" text-anchor="middle" font-size="12" fill="var(--muted)">총 지출</text><text x="90" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">${sp>=1e6?(sp/1e4).toFixed(0)+'만원':won(sp)}</text></svg>

        return `<div class="swipe" data-id="${e.id}"><button class="swipe-del" data-act="del-exp" data-v="${e.id}">삭제</button><div class="swipe-inner row">${catIc(EXCATS[e.cat].color)}<div class="grow"><b>${esc(e.memo||EXCATS[e.cat].label)}</b><span>${EXCATS[e.cat].label} · ${esc(m.name)} 결제${e.ocr?' · 영수증':''}</span></div>
        <div class="amt"><b class="num">${won(toKRW(e.amount,e.cur))}</b>${e.cur!=='KRW'?`<span class="num">${fmtCur(e.amount,e.cur)}</span>`:''}</div><button class="icon-btn" data-act="del-exp" data-v="${e.id}" aria-label="삭제">${ic('trash','sm')}</button></div></div>`; }).join('')}</div>`).join('')
      : `<div class="empty"><span class="ei">${ic('wallet')}</span><b>첫 지출을 기록해 보세요</b><span>현지 통화로 입력하면 원화로 바로 바꿔 드려요.</span></div>`}
  </section>`;

/* ---------- packing ---------- */

  const C = 2*Math.PI*36;
  const D = DEST[t.dest];
  const tasks = t.tasks.map(x=>({...x, ...taskDue(t,x)})).sort((a,b)=>a.done-b.done || a.left-b.left);
  return `
  <section class="card"><div class="prog">
    <div class="ring"><svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="36" fill="none" stroke="var(--surface-2)" stroke-width="9"/><circle cx="43" cy="43" r="36" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}"/></svg><b class="num">${pct}%</b></div>
    <div style="flex:1;min-width:200px;display:grid;gap:6px"><h2 style="font-size:18px">${pct===100?'짐 싸기 완료! 즐거운 여행 되세요':`${t.packing.length-done}개만 더 챙기면 돼요`}</h2>

  </div></section>
  <div class="grid-2" style="align-items:start">
    <section class="card">

          ${p.shared ? `<button class="assignee" data-act="pack-who" data-v="${p.id}" title="담당자 바꾸기">${w?`<span class="avatar" style="background:${w.color}">${esc(w.name[0])}</span>`:`<span class="pill line">담당 지정</span>`}</button>` : ''}
          <button class="icon-btn" data-act="pack-share" data-v="${p.id}" title="${p.shared?'공유 해제':'일행과 공유'}" style="${p.shared?'color:var(--accent)':''}">${ic('users','sm')}</button>
        </div></div>`; }).join('') || `<div class="empty"><b>이 분류에는 아직 항목이 없어요</b></div>`}</div>
      <form class="add-inline" data-form="pack" style="margin-top:12px"><input class="input" id="pk-name" name="name" placeholder="준비물 추가 (예: 목베개)" autocomplete="off"><button class="btn primary">${ic('plus','sm')} 추가</button></form>
    </section>
  </div>`;
}

/* ---------- vault ---------- */
function viewVault(t){
  const online = navigator.onLine;
  const bySched = {};
  t.vouchers.forEach(v => (bySched[v.schedId||'none'] ??= []).push(v));
  const label = id => { const s = t.schedule.find(x=>x.id===id); return s ? `DAY ${s.day+1} · ${s.time} ${s.title}` : '일정 미연결'; };

  ${t.vouchers.length ? order.map(k => `<section><div class="day-head" style="padding-top:0"><span>${esc(label(k))}</span></div><div class="vgrid">${bySched[k].map(v => `

  <section class="card"><div class="card-h"><h2>여행 메모</h2><span class="muted" style="font-size:12.5px" id="memo-st">자동 저장</span></div>

/* ---------- chat ---------- */
function renderChat(){
  const root = $('#chat-root');
  if (!state.chatOpen || !session || !trip()) { root.innerHTML = ''; return; }
  const t = trip();
  root.innerHTML = `<aside class="chat" aria-label="일행 채팅">
    <div class="chat-h"><div><b>일행 채팅</b><div class="avatars" style="margin-top:4px">${t.members.map(m=>`<span class="avatar" style="background:${m.color};width:22px;height:22px;font-size:10px">${esc(m.name[0])}</span>`).join('')}</div></div><button class="icon-btn" data-act="chat-close" aria-label="닫기">${ic('x')}</button></div>
    <div class="chat-b" id="chat-b">${t.chat.map(c => { if (c.sys) return `<div class="sys">${esc(c.text)}</div>`; const m = t.members.find(x=>x.id===c.who) || {name:'?',color:'#888'}; const mine = c.who==='me';
      return `<div class="msg ${mine?'me':''}">${mine?'':`<span class="avatar" style="background:${m.color}">${esc(m.name[0])}</span>`}<div><div class="meta">${mine?'':esc(m.name)+' · '}${new Date(c.ts).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div><div class="bub">${esc(c.text)}</div></div></div>`; }).join('')}</div>
    ${state.typing ? `<div class="typing">${esc(state.typing)}님이 입력 중…</div>` : ''}
    <form class="chat-f" data-form="chat" autocomplete="off"><input class="input" id="chat-in" name="m" placeholder="일정에 대한 의견을 나눠 보세요"><button class="btn primary" aria-label="보내기">${ic('send','sm')}</button></form>
  </aside>`;
  const b = $('#chat-b'); b.scrollTop = b.scrollHeight;
}
function sysLog(text){ const t = trip(); t.chat.push({sys:true, text, ts:Date.now()}); if (!state.chatOpen) state.unread++; }
function botReply(text){
  const t = trip(); const others = t.members.filter(m=>m.id!=='me'); if (!others.length) return;
  const m = others[Math.floor(Math.random()*others.length)];
  const R = [[/맛집|식당|먹|저녁|점심/, '좋아요! 근처 맛집 하나 더 찾아서 일정에 넣어볼게요'], [/예산|돈|비싸|환율/, '가계부 보니까 아직 여유 있어요. 쇼핑은 조금만!'],
    [/일정|시간|몇 시/, '그 시간 괜찮아요. 이동 시간도 지도에서 확인해 봤어요'], [/짐|준비|챙/, '공동 준비물 중에 멀티탭은 제가 챙길게요'], [/.*/, '확인했어요 👍']];
  const reply = R.find(([re]) => re.test(text))[1];
  state.typing = m.name; renderChat();
  setTimeout(() => { state.typing = null; t.chat.push({who:m.id, text:reply, ts:Date.now()}); save(); if (!state.chatOpen) state.unread++; render(); }, 1400);
}

/* ---------- toast ---------- */
function toast(msg, action){
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${action?`<button>${esc(action.label)}</button>`:''}`;
  if (action) el.querySelector('button').onclick = () => { action.fn(); el.remove(); };
  $('#toast-root').appendChild(el); setTimeout(()=>el.remove(), action?6000:2800);
}

/* ---------- main render ---------- */
function render(){
  const app = $('#app'); const sy = window.scrollY;
  if (!session) app.innerHTML = viewAuth();
  else if (!db.trips.length || state.creating) app.innerHTML = viewOnboarding();
  else app.innerHTML = viewShell();
  renderChat();
  window.scrollTo(0, sy);
}

    if ((c==='어르신'||c==='아이') && o.comps.includes(c)) o.relaxed = true; render(); },
  'ob-relax': () => { state.ob.relaxed = !state.ob.relaxed; render(); },
  'ob-budget': el => { state.ob.budget = +el.dataset.v; render(); },
  'ob-back': () => { state.ob.step--; render(); },
  'ob-cancel': () => { state.creating = false; render(); },
  'ob-next': () => { const o = state.ob;
    if (o.step===0 && !o.dest) return;
    if (o.step===1 && o.end < o.start) return toast('도착일이 출발일보다 빨라요');
    if (o.step < 2) { o.step++; return render(); }
    const t = makeTrip({dest:o.dest, start:o.start, end:o.end, comps:o.comps.length?o.comps:['혼자'], relaxed:o.relaxed, budget:+o.budget||0, name:db.name});
    db.trips.push(t); db.active = t.id; state.creating = false; state.tab = 'home'; save(); render();
    toast(`${DEST[o.dest].name} 맞춤 준비물 ${t.packing.length}개를 만들었어요`); },
  // schedule
  day: el => { state.day = +el.dataset.v; state.hl = null; render(); },
  relax: () => { const t = trip(); t.relaxed = !t.relaxed; save(); render(); toast(t.relaxed ? '여유 모드: 이동 시간을 넉넉히 잡고 휴식을 추천해요' : '일반 일정 모드로 바꿨어요'); },
  'add-sched': () => schedSheet(),
  'edit-sched': el => schedSheet(el.dataset.v),
  'del-sched': el => { const t = trip(), i = t.schedule.findIndex(x=>x.id===el.dataset.v); if (i<0) return; const [s] = t.schedule.splice(i,1); sysLog(`${db.name}님이 '${s.title}' 일정을 삭제했어요`); save(); render();
    toast(`'${s.title}' 삭제됨`, {label:'되돌리기', fn:()=>{ t.schedule.push(s); save(); render(); }}); },
  'add-rest': el => { const t = trip(), s = t.schedule.find(x=>x.id===el.dataset.after); const r = nearestRest(t, s);
    const start = toMin(s.time)+s.dur; const items = dayItems(t, s.day).filter(x=>toMin(x.time)>=start);
    t.schedule.push({id:uid(), day:s.day, time:toTime(start), dur:30, title:`휴식 · ${r.name}`, cat:'rest', place:r.name, addr:r.addr, lat:r.lat, lng:r.lng, note:'여유 모드 추천 휴식'});
    items.forEach(x => x.time = toTime(toMin(x.time)+30)); save(); render(); toast('휴식 30분을 넣고 뒤 일정을 30분씩 미뤘어요'); },
  suggest: () => { const t = trip(); const P = n => DEST[t.dest].places.find(p=>p.name===n);
    SUGGEST[t.dest].forEach(([n,d,time,dur]) => { const p = P(n); if (d < tripDays(t)) t.schedule.push({id:uid(), day:d, time, dur, title:p.name, cat:p.cat, place:p.name, addr:p.addr, lat:p.lat, lng:p.lng, note:''}); });
    sysLog(`${db.name}님이 추천 일정을 불러왔어요`); save(); state.tab='schedule'; render(); toast('인기 장소로 추천 일정을 채웠어요. 자유롭게 바꿔 보세요'); },
  pin: el => { state.hl = el.dataset.v; render(); const c = $('#s-'+el.dataset.v); c?.scrollIntoView({behavior:'smooth', block:'center'}); },
  'goto-sched': el => { const t = trip(), s = t.schedule.find(x=>x.id===el.dataset.v); closeSheet(); state.tab='schedule'; state.day=s.day; state.hl=s.id; render(); setTimeout(()=>$('#s-'+s.id)?.scrollIntoView({block:'center'}),30); },
  optimize: () => {
    const t = trip(), items = dayItems(t, state.day); if (items.length < 3) return;
    const before = items.slice(1).reduce((s,x,i)=>s+travel(items[i],x,t).km,0);
    const first = items[0], fixLast = ['stay','move'].includes(items.at(-1).cat) ? items.at(-1) : null;
    let pool = items.slice(1, fixLast ? -1 : undefined), route = [first], cur = first;
    while (pool.length) { pool.sort((a,b)=>hav(cur,a)-hav(cur,b)); cur = pool.shift(); route.push(cur); }
    if (fixLast) route.push(fixLast);
    const after = route.slice(1).reduce((s,x,i)=>s+travel(route[i],x,t).km,0);
    if (after >= before - 0.05) return toast('이미 가장 짧은 동선이에요');
    const backup = items.map(x=>({id:x.id, time:x.time}));
    let tm = toMin(first.time);
    route.forEach((x,i) => { if (i>0) { tm = ceil5(tm + travel(route[i-1], x, t).min + (t.relaxed?10:0)); x.time = toTime(tm); } tm += x.dur; });
    sysLog(`${db.name}님이 DAY ${state.day+1} 동선을 최적화했어요`); save(); render();
    toast(`이동 거리 ${before.toFixed(1)}km → ${after.toFixed(1)}km`, {label:'되돌리기', fn:()=>{ backup.forEach(b=>{ const x=t.schedule.find(s=>s.id===b.id); if(x) x.time=b.time; }); save(); render(); }});
  },
  'pick-place': el => { const f = el.closest('form'), t = trip(), p = DEST[t.dest].places[+el.dataset.v];
    f.q.value = p.name; f.lat.value = p.lat; f.lng.value = p.lng; f.addr.value = p.addr; if (!f.elements.title.value || f.elements.title.dataset.auto) { f.elements.title.value = p.name; f.elements.title.dataset.auto = 1; }
    setChip(f, 'cat', p.cat); $('.ac-list', f).hidden = true; },
  chip: el => setChip(el.closest('form'), el.dataset.field, el.dataset.v),
  // budget
  'add-exp': el => expSheet(el?.dataset?.ocr),
  'del-exp': el => { const t = trip(), i = t.expenses.findIndex(x=>x.id===el.dataset.v); const [e] = t.expenses.splice(i,1); save(); render(); toast('지출을 삭제했어요', {label:'되돌리기', fn:()=>{ t.expenses.push(e); save(); render(); }}); },
  'set-budget': budgetSheet,
  'bd-quick': el => { $('#bd-v').value = el.dataset.v; },
  'fx-quick': el => { const l = $('#fx-l'); l.value = el.dataset.v; l.dispatchEvent(new Event('input', {bubbles:true})); },
  // packing
  task: el => { const t = trip(), x = t.tasks.find(k=>k.id===el.dataset.v); x.done = !x.done; save(); render(); if (x.done) toast(`'${x.title}' 완료!`); },
  pack: el => { const t = trip(), p = t.packing.find(k=>k.id===el.dataset.v); p.done = !p.done; save(); render();
    if (t.packing.every(k=>k.done)) toast('모든 준비물을 챙겼어요. 즐거운 여행 되세요!'); },
  'pack-filter': el => { state.packFilter = el.dataset.v; render(); },
  'pack-who': el => { const t = trip(), p = t.packing.find(k=>k.id===el.dataset.v); const ids = [null, ...t.members.map(m=>m.id)]; p.who = ids[(ids.indexOf(p.who)+1) % ids.length]; save(); render(); },
  'pack-share': el => { const t = trip(), p = t.packing.find(k=>k.id===el.dataset.v); p.shared = !p.shared; if (!p.shared) p.who = null; else sysLog(`'${p.name}'을(를) 공동 준비물로 공유했어요`); save(); render(); },
  'pack-del': el => { const t = trip(), i = t.packing.findIndex(k=>k.id===el.dataset.v); const [p] = t.packing.splice(i,1); save(); render(); toast(`'${p.name}' 삭제됨`, {label:'되돌리기', fn:()=>{ t.packing.splice(i,0,p); save(); render(); }}); },
  // vault
  'add-voucher': () => voucherSheet(),
  'view-voucher': el => voucherView(el.dataset.v),
  'del-voucher': el => { const t = trip(); t.vouchers = t.vouchers.filter(v=>v.id!==el.dataset.v); save(); closeSheet(); render(); toast('바우처를 삭제했어요'); },
  // social
  invite: inviteSheet,
  copy: el => { const v = el.dataset.v; const done = () => toast('초대 링크를 복사했어요');
    try { navigator.clipboard.writeText(v).then(done, () => { selectText('#inv-link'); toast('링크를 선택했어요. 복사해서 보내 주세요'); }); } catch(e) { selectText('#inv-link'); } },
  chat: () => { state.chatOpen = true; state.unread = 0; render(); setTimeout(()=>$('#chat-in')?.focus(), 50); },
  'chat-close': () => { state.chatOpen = false; render(); },
  'sheet-close': closeSheet,
  'sheet-bg': (el, e) => { if (e.target === el) closeSheet(); }
};
function selectText(sel){ const n = $(sel); if (!n) return; const r = document.createRange(); r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function setChip(f, field, v){ if (!f) return; f.elements[field].value = v; $$(`[data-act="chip"][data-field="${field}"]`, f).forEach(b => b.classList.toggle('on', b.dataset.v === String(v)));
  if (field === 'cur') updateConv(f); }
function updateConv(f){ const amt = parseFloat(f.amount.value)||0, cur = f.cur.value, c = $('#conv');
  if (c) c.innerHTML = cur==='KRW' ? '원화로 기록돼요' : amt ? `≈ <b>${won(toKRW(amt,cur))}</b> · 1 ${cur} = ${RATES[cur].toFixed(cur==='JPY'?2:4)}원` : `1 ${cur} = ${RATES[cur].toFixed(cur==='JPY'?2:4)}원 적용`; }

/* ---------- forms ---------- */
const F = {
  auth: doLogin,
  sched: f => {
    const t = trip(), id = f.dataset.id;
    const title = f.elements.title.value.trim() || f.q.value.trim();
    if (!title) return formErr(f, '장소를 검색하거나 일정명을 입력해 주세요.');
    let lat = parseFloat(f.lat.value), lng = parseFloat(f.lng.value);
    const place = f.q.value.trim() || title;
    if (isNaN(lat)) { const c = DEST[t.dest].places; const a = c.reduce((s,p)=>({lat:s.lat+p.lat/c.length, lng:s.lng+p.lng/c.length}),{lat:0,lng:0}); lat = a.lat + (Math.random()-.5)*.01; lng = a.lng + (Math.random()-.5)*.01; }
    const data = {title, place, addr:f.addr.value, lat, lng, cat:f.cat.value, day:+f.day.value, time:f.time.value || '10:00', dur:+f.dur.value, note:f.note.value.trim()};
    if (id) Object.assign(t.schedule.find(x=>x.id===id), data);
    else { t.schedule.push({id:uid(), ...data}); sysLog(`${db.name}님이 '${title}' 일정을 추가했어요`); }
    state.day = data.day; save(); closeSheet(); if (state.tab!=='schedule') state.tab='schedule'; render(); toast(id ? '일정을 수정했어요' : `DAY ${data.day+1}에 '${title}'을(를) 추가했어요`);
  },
  exp: f => {
    const t = trip(), amount = parseFloat(f.amount.value);
    if (!(amount > 0)) return formErr(f, '금액을 입력해 주세요.');
    t.expenses.push({id:uid(), date:f.date.value || iso(today()), amount, cur:f.cur.value, cat:f.cat.value, memo:f.memo.value.trim(), by:f.by.value, ocr:!!f.ocr.value});
    save(); closeSheet(); state.tab='budget'; render();
    const left = t.budget - spent(t); toast(`${won(toKRW(amount,f.cur.value))} 기록 · 남은 예산 ${won(left)}`);
  },
  voucher: async f => {
    const t = trip(), title = f.elements.title.value.trim();
    if (!title && !pendingFile) return formErr(f, '파일을 고르거나 제목을 입력해 주세요.');
    const v = {id:uid(), title:title || pendingFile.name, type:f.elements.type.value, schedId:f.schedId.value || null, memo:f.memo.value.trim()};
    if (pendingFile) { if (pendingFile.size > 3*1024*1024) return formErr(f, '파일이 3MB를 넘어요. 더 작은 파일을 골라 주세요.');
      v.data = await readFile(pendingFile); v.mime = pendingFile.type; v.fileName = pendingFile.name; }
    t.vouchers.push(v); pendingFile = null;
    if (!store.set('tb.u.'+session, db)) { t.vouchers.pop(); return formErr(f, '기기 저장 공간이 부족해요. 다른 바우처를 지우거나 작은 파일을 올려 주세요.'); }
    closeSheet(); state.tab='vault'; render(); toast('바우처를 보관했어요. 오프라인에서도 열 수 있어요');
  },
  pack: f => { const n = f.elements.name.value.trim(); if (!n) return; const t = trip(); const g = ['전체','공유'].includes(state.packFilter) ? '추가 항목' : state.packFilter;
    t.packing.push({id:uid(), group:g, name:n, done:false, shared:state.packFilter==='공유', who:null}); save(); render(); $('#pk-name')?.focus(); },
  budget: f => { const t = trip(); t.budget = Math.max(0, +f.v.value||0); save(); closeSheet(); render(); toast(`예산을 ${won(t.budget)}으로 설정했어요`); },
  member: f => { const n = f.elements.name.value.trim(); if (!n) return; const t = trip(); t.members.push({id:uid(), name:n, color:MEMBER_COLORS[t.members.length % MEMBER_COLORS.length]}); sysLog(`${n}님이 여행에 참여했어요`); save(); inviteSheet(); render(); toast(`${n}님을 일행으로 추가했어요`); },
  chat: f => { const m = f.m.value.trim(); if (!m) return; const t = trip(); t.chat.push({who:'me', text:m, ts:Date.now()}); save(); renderChat(); $('#chat-in')?.focus(); botReply(m); }
};
const readFile = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });

/* ---------- OCR (demo recognizer) ---------- */
async function runOCR(file){
  const t = trip(), D = DEST[t.dest], f = $('form[data-form="exp"]'); if (!f) return;
  const url = await readFile(file).catch(()=>null);
  $('#ocr-box').innerHTML = `${url?`<img src="${url}" alt="">`:''}<span class="spinner"></span><span>영수증을 읽는 중…</span>`;
  await new Promise(r => setTimeout(r, 1300));
  const foods = D.places.filter(p => ['food','dessert','shop'].includes(p.cat)); const p = foods[Math.floor(Math.random()*foods.length)];
  const base = {JPY:[980,6800], VND:[85000,650000], EUR:[8,64], KRW:[9000,68000], USD:[8,60]}[D.cur] || [10,100];
  let amt = base[0] + Math.random()*(base[1]-base[0]); amt = D.cur==='EUR'||D.cur==='USD' ? Math.round(amt*100)/100 : Math.round(amt/10)*10;
  const inTrip = ddayInfo(t).phase === 1;
  setChip(f, 'cur', D.cur); f.amount.value = amt; f.memo.value = p.name; f.ocr.value = '1';
  f.date.value = inTrip ? iso(today()) : t.start; setChip(f, 'cat', p.cat==='shop'?'shop':'food'); updateConv(f);
  $('#ocr-box').innerHTML = `${url?`<img src="${url}" alt="">`:''}<span><b style="color:var(--ok)">인식 완료</b> · ${esc(p.name)} · ${fmtCur(amt, D.cur)}<br><span class="muted">예시 인식 결과예요. 실제 금액과 다르면 고쳐 주세요.</span></span>`;
}

/* ---------- global listeners ---------- */
document.addEventListener('click', e => {
  if (!e.target.closest('.ac')) $$('.ac-list').forEach(l => l.hidden = true);
  const el = e.target.closest('[data-act]'); if (!el) { if (state.tripMenu && !e.target.closest('.side')) { state.tripMenu=false; render(); } return; }
  if (el.closest('.swipe.open') && el.dataset.act !== 'del-sched' && el.dataset.act !== 'del-exp' && el.dataset.act !== 'pack-del') { closeSwipes(); return; }
  if (el.tagName === 'BUTTON' && el.closest('form') && el.dataset.act) e.preventDefault();
  A[el.dataset.act]?.(el, e);
});
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target; formErr(f, ''); F[f.dataset.form]?.(f); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.ob) { state.ob[el.dataset.ob] = el.value; if (el.dataset.ob==='start' && state.ob.end < el.value) state.ob.end = el.value; if (el.type==='date') render(); return; }
  if (el.dataset.memo !== undefined) { trip().memo = el.value; clearTimeout(el._t); $('#memo-st').textContent = '입력 중…'; el._t = setTimeout(()=>{ save(); const s=$('#memo-st'); if (s) s.textContent = '저장됨 · 오프라인 열람 가능'; }, 500); return; }
  if (el.dataset.fx) { const cur = el.dataset.cur, v = parseFloat(el.value)||0;
    if (el.dataset.fx==='l') $('#fx-k').value = Math.round(v*RATES[cur]); else $('#fx-l').value = +(v/RATES[cur]).toFixed(cur==='JPY'||cur==='VND'?0:2); return; }
  if (el.dataset.conv !== undefined) { updateConv(el.form); return; }
  if (el.name === 'title' && el.form?.dataset.form==='sched') { delete el.dataset.auto; }
  if (el.dataset.ac !== undefined) {
    const f = el.form, list = $('.ac-list', f), q = el.value.trim().toLowerCase(); f.lat.value=''; f.lng.value=''; f.addr.value='';
    const P = DEST[trip().dest].places; const hits = P.map((p,i)=>({...p,i})).filter(p => !q || p.name.toLowerCase().includes(q) || p.addr.toLowerCase().includes(q) || CATS[p.cat].label.includes(q));
    list.hidden = false;
    list.innerHTML = hits.slice(0,7).map(p => `<button type="button" data-act="pick-place" data-v="${p.i}">${catIc(p.cat)}<div class="grow"><b>${esc(p.name)}</b><span>${CATS[p.cat].label} · ${esc(p.addr)}</span></div></button>`).join('')
      + (q ? `<button type="button" data-act="ac-close">${ic('plus','sm')}<div class="grow"><b>'${esc(el.value)}' 직접 입력</b><span>목록에 없는 장소로 추가해요</span></div></button>` : '');
  }
});
A['ac-close'] = el => { const f = el.closest('form'); $('.ac-list', f).hidden = true; if (!f.elements.title.value) f.elements.title.value = f.q.value; f.elements.title.focus(); };
document.addEventListener('focusin', e => { if (e.target.dataset?.ac !== undefined && !e.target.value) e.target.dispatchEvent(new Event('input', {bubbles:true})); });
document.addEventListener('change', async e => {
  const el = e.target; if (!el.dataset?.file || !el.files?.[0]) return;
  const file = el.files[0];
  if (el.dataset.file === 'ocr') runOCR(file);
  if (el.dataset.file === 'vquick') voucherSheet(file);
  if (el.dataset.file === 'voucher') { pendingFile = file; $('#vf-name').textContent = file.name; const ti = $('#vf-title'); if (!ti.value) ti.value = file.name.replace(/\.[^.]+$/,''); }
});
// drag & drop on vault
document.addEventListener('dragover', e => { const d = e.target.closest?.('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { e.target.closest?.('#drop')?.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest?.('#drop'); if (!d) return; e.preventDefault(); d.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) voucherSheet(f); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#sheet-root').innerHTML) closeSheet(); else if (state.chatOpen) A['chat-close'](); } });
addEventListener('online', () => { render(); toast('다시 연결됐어요. 변경 사항을 동기화했어요'); fetchRates(); });
addEventListener('offline', () => { render(); toast('오프라인이에요. 저장된 일정과 바우처는 계속 볼 수 있어요'); });

/* ---------- swipe to delete (touch) ---------- */
let sw = null;
function closeSwipes(except){ $$('.swipe.open').forEach(s => { if (s !== except) { s.classList.remove('open'); $('.swipe-inner', s).style.transform = ''; } }); }
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return; const s = e.target.closest('.swipe'); if (!s) { closeSwipes(); return; }
  sw = {s, x:e.clientX, y:e.clientY, dx:0, base:s.classList.contains('open') ? -84 : 0, lock:null};
});
document.addEventListener('pointermove', e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (sw.lock === null && Math.hypot(dx,dy) > 8) sw.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  if (sw.lock !== 'x') return; sw.dx = dx; sw.s.classList.add('dragging');
  $('.swipe-inner', sw.s).style.transform = `translateX(${Math.max(-100, Math.min(0, sw.base + dx))}px)`;
});
document.addEventListener('pointerup', () => {
  if (!sw) return; const {s, dx, base, lock} = sw; sw = null; s.classList.remove('dragging'); if (lock !== 'x') return;
  const open = base + dx < -42; closeSwipes(s); s.classList.toggle('open', open); $('.swipe-inner', s).style.transform = open ? 'translateX(-84px)' : '';
});

/* ---------- boot ---------- */
render();
fetchRates();
</script>
</body></html>
